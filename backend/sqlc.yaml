version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/postgres/query"
    schema: "migrations/*.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/repository/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
