version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/postgres/query"
    schema: "migrations/000001_auth.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/repository/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  - engine: "postgresql"
    queries: "internal/repository/postgres/eventquery"
    schema:
      - "migrations/000001_auth.up.sql"
      - "migrations/000004_event_store.up.sql"
    gen:
      go:
        package: "eventsqlc"
        out: "internal/repository/postgres/eventsqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
